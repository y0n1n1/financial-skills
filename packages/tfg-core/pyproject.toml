[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tfg-core"
version = "0.1.0"
description = "Pure quantitative primitives behind The Financial Gauntlet: Bayesian updating with uncertainty propagation, Monte Carlo EV, Black-Scholes implied probabilities, Black-Litterman allocation, Kelly gating, and calibration scoring."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Gabriel Tonini Lopes Gramicelli" }]
keywords = ["bayesian", "monte-carlo", "black-litterman", "kelly-criterion", "calibration", "quantitative-finance"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Financial and Insurance Industry",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Office/Business :: Financial :: Investment",
  "Typing :: Typed",
]
dependencies = ["numpy>=1.24", "scipy>=1.10", "uncertainties>=3.1"]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.urls]
Homepage = "https://github.com/y0n1n1/financial-skills"
Source = "https://github.com/y0n1n1/financial-skills"

[tool.hatch.build.targets.wheel]
packages = ["tfg_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
